base:
  seed: 1111
  batch_size: 64
  num_workers: 8
  train_mode: regression
  missing_pattern: continuous
  missing_rate_eval_test: [0.0, 0.0, 0.0]
  block_rate: 0.0
  mcssm_indicator_source: automatic
  automatic_missingness:
    audio_threshold: 0.16
    vision_threshold: 0.19

dataset:
  datasetName: mosi
  dataPath: "./data/CMU_MOSI/Processed/unaligned_50.pkl"

model:
  com_dim: &com_dim 128
  dropout: &dropout 0.1
  feature_extractor:
    bert_pretrained: "./bert-base-uncased"
  tmm:
    input_length: [50, 500, 375]
    input_dim: [768, 35, 74]
    hidden_dim: *com_dim
  reconstruction:
    output_dim: 768
    dropout: *dropout
    loss_weight: 0.7
  tc_mamba:
    num_layers: 1
    d_model: *com_dim
    d_ffn: 1024
    activation: GELU
    dropout: *dropout
    causal: false
    mamba_config:
      d_state: 12
      expand: 4
      d_conv: 4
      bidirectional: true
  tq_mamba:
    num_layers: 1
    d_model: *com_dim
    d_ffn: 1024
    activation: GELU
    dropout: *dropout
    causal: false
    rope_base: 10000.0
    attn_heads: 8
    mamba_config:
      d_state: 12
      expand: 4
      d_conv: 4
      bidirectional: true
  regression:
    input_dim: *com_dim
    out_dim: 1
